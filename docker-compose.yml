# Run JobHub from the published image (default) or build it locally.
#   docker compose pull && docker compose up -d      # use ghcr.io image
#   docker compose up -d --build                     # build from this folder instead
# Copy .env.example to .env and fill it in first. The database lives in ./data.
services:
  jobhub:
    image: ghcr.io/thebumgreg/stop-journal:latest
    build: .
    container_name: jobhub
    env_file: .env
    environment:
      DATA_DIR: /data
    # Unraid: set PUID=99 and PGID=100 in your environment so ./data is writable
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
