<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Journal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='day.css') }}">
</head>
<body>
<header>
  <button id="prev" aria-label="Previous day">&larr;</button>
  <input type="date" id="date" value="{{ date }}">
  <button id="next" aria-label="Next day">&rarr;</button>
  <span class="tz">{{ tz }} · <a href="/settings">Settings</a></span>
</header>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>
<footer id="foot"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='day.js') }}"></script>
</body>
</html>
