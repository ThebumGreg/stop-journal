<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Journal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#6a737d; --line:#d8dee4; --sel:#e8f1ff; --acc:#0b66d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --fg:#e6e9ec; --muted:#98a2ad; --line:#2c333b; --sel:#1d2b3f; --acc:#5aa2ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); }
  header input, header button { font:inherit; padding:6px 10px; background:var(--bg); color:var(--fg);
         border:1px solid var(--line); border-radius:6px; }
  header .tz { color:var(--muted); margin-left:auto; font-size:13px; }
  main { flex:1; display:flex; min-height:0; }
  #list { width:360px; overflow:auto; border-right:1px solid var(--line); }
  #map { flex:1; }
  .row { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row.sel { background:var(--sel); }
  .row .t { font-weight:600; }
  .row .m { color:var(--muted); font-size:13px; }
  .drive { padding:6px 12px 6px 28px; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:6px; color:var(--muted); }
  .find { margin-top:6px; font:inherit; font-size:13px; padding:3px 8px; background:var(--bg); color:var(--acc);
          border:1px solid var(--line); border-radius:6px; }
  .panel { padding:8px 12px 10px; border-bottom:1px solid var(--line); background:var(--sel); }
  .panel form { display:flex; gap:6px; margin-bottom:6px; }
  .panel input { flex:1; min-width:0; font:inherit; padding:5px 8px; background:var(--bg); color:var(--fg);
          border:1px solid var(--line); border-radius:6px; }
  .panel button { font:inherit; padding:5px 10px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .cand { padding:6px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .cand .n { font-weight:600; }
  .cand .a { color:var(--muted); font-size:12px; }
  .err { color:#d1242f; font-size:13px; }
  footer { padding:8px 12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  #msg { padding:12px; color:var(--muted); }
  @media (max-width:700px) {
    main { flex-direction:column-reverse; }
    #list { width:100%; height:45%; border-right:0; border-top:1px solid var(--line); }
    #map { height:55%; flex:none; }
  }
</style>
</head>
<body>
<header>
  <button id="prev" aria-label="Previous day">&larr;</button>
  <input type="date" id="date" value="{{ date }}">
  <button id="next" aria-label="Next day">&rarr;</button>
  <span class="tz">{{ tz }} · <a href="/settings">Settings</a></span>
</header>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>
<footer id="foot"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
map.setView([39, -98], 4);
let layer = L.layerGroup().addTo(map), candLayer = L.layerGroup().addTo(map), markers = {}, rows = {};
const dateEl = document.getElementById('date');
const hm = s => s.slice(11, 16);
const dur = m => m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm';

function select(i) {
  Object.values(rows).forEach(r => r.classList.remove('sel'));
  if (rows[i]) { rows[i].classList.add('sel'); rows[i].scrollIntoView({block: 'nearest'}); }
  if (markers[i]) { map.setView(markers[i].getLatLng(), Math.max(map.getZoom(), 16)); markers[i].openPopup(); }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function loadCands(s, box, q) {
  box.replaceChildren(el('div', 'a', 'Looking up places…'));
  candLayer.clearLayers();
  const u = new URLSearchParams({lat: s.lat, lon: s.lon, minutes: s.minutes});
  if (q) u.set('q', q);
  let d;
  try {
    const r = await fetch('/api/suggest?' + u);
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) { box.replaceChildren(el('div', 'err', 'Lookup failed (' + e.message + ').')); return; }
  box.replaceChildren();
  if (d.error) box.append(el('div', 'err', d.error));
  if (!d.candidates.length) box.append(el('div', 'a', 'No matches. Try the search box.'));
  d.candidates.forEach(c => {
    const row = el('div', 'cand');
    row.append(el('div', 'n', c.name + (c.source === 'known' ? '  ★ known' : c.source === 'google' ? '  (Google)' : '')),
      el('div', 'a', [c.address, c.category, Math.round(c.distance_m) + ' m'].filter(Boolean).join(' · ')));
    row.onclick = () => {
      candLayer.clearLayers();
      // Google's terms don't allow Places content on non-Google maps, so no pin for those.
      if (c.source === 'google') return;
      const m = L.marker([c.lat, c.lon]).addTo(candLayer).bindPopup(c.name).openPopup();
      map.panTo(m.getLatLng());
    };
    box.append(row);
  });
}

function addFinder(s, host) {
  const btn = el('button', 'find', 'Find business');
  host.append(btn);
  let panel = null;
  btn.onclick = ev => {
    ev.stopPropagation();
    if (panel) { panel.remove(); panel = null; candLayer.clearLayers(); return; }
    panel = el('div', 'panel');
    const form = el('form'), inp = el('input'), go = el('button', null, 'Search');
    inp.placeholder = 'Search by name or address'; go.type = 'submit';
    const box = el('div');
    form.append(inp, go); panel.append(form, box);
    form.onsubmit = e => { e.preventDefault(); loadCands(s, box, inp.value.trim()); };
    host.after(panel);
    loadCands(s, box, '');
  };
}

async function load() {
  const date = dateEl.value;
  history.replaceState(null, '', '/day/' + date);
  const list = document.getElementById('list');
  list.replaceChildren(el('div', null, 'Loading…')); list.firstChild.id = 'msg';
  layer.clearLayers(); candLayer.clearLayers(); markers = {}; rows = {};
  let d;
  try {
    const r = await fetch('/api/day/' + date);
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) {
    list.firstChild.textContent = 'Could not load this day (' + e.message + ').'; return;
  }
  list.replaceChildren();
  if (!d.stops.length) list.append(Object.assign(el('div', null,
    d.raw_count ? 'No stops detected (' + d.kept_count + ' usable points).' : 'No location points for this day.'), {id: 'msg'}));
  const bounds = [];
  if (d.path.length) {
    L.polyline(d.path, {color: '#0b66d0', weight: 3, opacity: .7}).addTo(layer);
    d.path.forEach(p => bounds.push(p));
  }
  d.stops.forEach((s, n) => {
    const label = s.kind === 'short' ? 'Short stop' : 'Stop ' + (d.stops.slice(0, n + 1).filter(x => x.kind === 'stop').length);
    const row = el('div', 'row'); rows[s.index] = row;
    const t = el('div', 't', hm(s.arrive) + ' – ' + hm(s.depart));
    if (s.kind === 'short') t.append(el('span', 'tag', 'short'));
    row.append(t, el('div', 'm', label + ' · ' + dur(s.minutes)));
    row.onclick = () => select(s.index);
    list.append(row);
    addFinder(s, row);
    const m = L.circleMarker([s.lat, s.lon], {radius: 9, color: s.kind === 'short' ? '#999' : '#d1242f',
      fillOpacity: .85, weight: 2}).addTo(layer).bindPopup(label + '<br>' + hm(s.arrive) + ' – ' + hm(s.depart));
    m.on('click', () => select(s.index));
    markers[s.index] = m;
    const nd = d.drives.find(x => x.from === s.index);
    if (nd) list.append(el('div', 'drive', '↓ Drive ' + hm(nd.depart) + ' – ' + hm(nd.arrive) +
      ' · ' + dur(nd.minutes) + ' · ~' + nd.miles_approx + ' mi (approx.)'));
  });
  if (bounds.length) map.fitBounds(bounds, {padding: [30, 30]});
  const t = d.totals;
  document.getElementById('foot').textContent =
    'On site ' + dur(Math.round(t.on_site_s / 60)) + ' · Driving ' + dur(Math.round(t.drive_s / 60)) +
    ' · ~' + t.miles_approx + ' mi · ' + t.stops + ' stops · ' + d.kept_count + '/' + d.raw_count + ' points used';
}

function shift(n) {
  const x = new Date(dateEl.value + 'T12:00:00'); x.setDate(x.getDate() + n);
  dateEl.value = x.toLocaleDateString('en-CA'); load();
}
document.getElementById('prev').onclick = () => shift(-1);
document.getElementById('next').onclick = () => shift(1);
dateEl.onchange = load;
load();
</script>
</body>
</html>
