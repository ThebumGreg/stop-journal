<!doctype html>
<html lang="en">
<head>
{% include "_head.html" %}
<title>JobHub</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='day.css') }}">
</head>
<body>
<header>
{% include "_nav.html" %}
  <div class="datebar">
    <button id="prev" aria-label="Previous day">&larr;</button>
    <input type="date" id="date" value="{{ date }}">
    <button id="next" aria-label="Next day">&rarr;</button>
  </div>
  <div id="live" class="live" hidden></div>
  <div id="bar"></div>
</header>
<main id="main">
  <div id="list"></div>
  <div id="split" role="separator" aria-label="Drag to resize the map" tabindex="0"><div class="grip"></div></div>
  <div id="map"></div>
</main>
<footer id="foot"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='day.js') }}"></script>
</body>
</html>
