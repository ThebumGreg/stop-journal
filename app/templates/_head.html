<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b66d0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JobHub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
{# use-credentials: Cloudflare Access refuses a manifest request that comes without its sign-in cookie #}
<link rel="manifest" href="{{ url_for('manifest') }}" crossorigin="use-credentials">
<meta name="jobhub-log" content="{{ jobhub_log_level }}">
<script src="{{ url_for('static', filename='clientlog.js') }}"></script>
<script src="{{ url_for('static', filename='share.js') }}" defer></script>
