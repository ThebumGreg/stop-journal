<!doctype html>
<html lang="en">
<head>
{% include "_head.html" %}
<title>JobHub – Truck</title>
<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
<style>
  .subnav { display:flex; gap:4px; overflow-x:auto; margin:0 0 12px; padding-bottom:2px; border-bottom:1px solid var(--line); }
  .subnav a { padding:8px 12px; border-radius:8px 8px 0 0; text-decoration:none; color:var(--acc); white-space:nowrap; font-size:15px; }
  .subnav a.on { background:var(--sel); color:var(--fg); font-weight:700; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:8px 0; }
  .chips button { border-radius:999px; padding:4px 12px; min-height:34px; font-size:14px; white-space:nowrap; }
  .chips button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .bar { display:flex; gap:8px; align-items:center; }
  .bar input { flex:1; }
  .part { display:flex; gap:10px; align-items:center; padding:12px 4px; min-height:56px; border-bottom:1px solid var(--line);
          cursor:pointer; color:inherit; text-decoration:none; }
  .part .body { flex:1; min-width:0; }
  .part .n { font-weight:600; }
  .part .m { color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .part::after { content:'›'; color:var(--muted); font-size:20px; }
  .qty { font-weight:700; white-space:nowrap; }
  .low { color:var(--warn); } .neg { color:var(--err); }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; display:grid; gap:10px; }
  .card h2 { margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .stocknow { font-size:28px; font-weight:800; }
  .hrow { padding:8px 0; border-top:1px solid var(--line); font-size:14px; color:inherit; text-decoration:none; display:block; }
  .hrow .m { color:var(--muted); font-size:13px; }
  .back { display:inline-block; margin-bottom:6px; text-decoration:none; color:var(--acc); }
  .crow { display:grid; grid-template-columns:1fr 96px; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .crow input { width:100%; }
  .group h3 { margin:14px 0 4px; font-size:16px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--bg); }
  .tile b { display:block; font-size:18px; }
  .fuellog { width:100%; border-collapse:collapse; font-size:13px; }
  .fuellog td, .fuellog th { padding:4px; border-bottom:1px solid var(--line); text-align:right; }
  .fuellog td:first-child, .fuellog th:first-child, .fuellog td:nth-child(2), .fuellog th:nth-child(2) { text-align:left; }
  .tools button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  /* new-part sheet */
  .sheetbg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheetbox { background:var(--bg); width:100%; max-width:760px; max-height:92vh; overflow:auto; border-radius:14px 14px 0 0;
              padding:14px 16px calc(16px + env(safe-area-inset-bottom)); display:grid; gap:10px; }
  .sheetbox h2 { margin:0; }
  .sheetbox fieldset { border:1px solid var(--line); border-radius:10px; padding:8px 10px 10px; }
  .sheetbox legend { font-size:13px; color:var(--muted); padding:0 4px; }
</style>
</head>
<body>
{% include "_header.html" %}
<main>
  <nav class="subnav" id="subnav" aria-label="Truck sections">
    <a href="#parts" data-v="parts">Parts</a>
    <a href="#stock" data-v="stock">Stock</a>
    <a href="#vendors" data-v="vendors">Vendors</a>
    <a href="#kits" data-v="kits">Kits</a>
    <a href="#fuel" data-v="fuel">Fuel</a>
    <a href="#data" data-v="data">Import / export</a>
  </nav>
  <div id="view"></div>
</main>
<script src="{{ url_for('static', filename='truck.js') }}"></script>
</body>
</html>
